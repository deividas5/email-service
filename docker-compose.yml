version: "3.9"

services:

  # ── MailHog — local SMTP + web UI (http://localhost:8025) ─────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ── Email Service ─────────────────────────────────────────────────────────
  email-service:
    build: .
    container_name: email-service
    ports:
      - "8080:8080"
    environment:
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    depends_on:
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
