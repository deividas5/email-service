version: "3.9"

services:

  # ── HashiCorp Vault (dev mode) ────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devroot
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Vault seeder — runs once, populates secret/email-service ─────────────
  vault-init:
    image: hashicorp/vault:1.17
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: devroot
    # Keys are stored as spring.mail.* so Spring Boot picks them up automatically
    entrypoint: >
      sh -c "
        vault kv put secret/email-service \
          'spring.mail.host=mailhog' \
          'spring.mail.port=1025' \
          'spring.mail.username=testuser' \
          'spring.mail.password=testpassword' &&
        echo 'Vault seeded with SMTP credentials'
      "
    restart: "no"

  # ── MailHog — local SMTP + web UI (http://localhost:8025) ─────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ── Email Service ─────────────────────────────────────────────────────────
  email-service:
    build: .
    container_name: email-service
    ports:
      - "8080:8080"
    environment:
      VAULT_HOST: vault
      VAULT_PORT: "8200"
      VAULT_TOKEN: devroot
    depends_on:
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
