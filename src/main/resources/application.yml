spring:
  application:
    name: email-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    check-template-location: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retry
  endpoint:
    health:
      show-details: always

resilience4j:
  retry:
    instances:
      emailRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.example.emailservice.exception.EmailSendException
          - org.springframework.mail.MailException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.emailservice: INFO
    io.github.resilience4j: DEBUG
