spring:
  application:
    name: email-service
  cloud:
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:devroot}
      kv:
        enabled: true
        backend: secret
        # Loads properties from secret/email-service
        default-context: email-service
    config:
      enabled: false   # use Vault directly, not Spring Cloud Config Server
